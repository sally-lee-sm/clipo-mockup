<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sally · 목업 모음</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    .wrap { max-width:760px; margin:0 auto; padding:64px 24px; }
    h1 { font-size:26px; margin:0 0 8px; }
    p.sub { color:var(--muted); margin:0 0 40px; font-size:15px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; }
    .card h2 { font-size:16px; margin:0 0 16px; }
    ul { list-style:none; margin:0; padding:0; }
    li { padding:14px 0; border-bottom:1px solid var(--line); }
    li:last-child { border-bottom:none; }
    a { color:var(--accent); text-decoration:none; font-weight:600; }
    a:hover { text-decoration:underline; }
    .empty { color:var(--muted); font-size:14px; }
    footer { margin-top:32px; color:var(--muted); font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sally · 목업 모음</h1>
    <p class="sub">CLIPO · HIAI 목업 화면을 여기서 공유해요.</p>
    <div class="card">
      <h2>화면 목록</h2>
      <ul>
        <li class="empty">아직 등록된 화면이 없어요. 첫 목업을 만들면 여기에 추가돼요.</li>
      </ul>
    </div>
    <footer>Mockup Starter Kit · GitHub Pages</footer>
  </div>
</body>
</html>
